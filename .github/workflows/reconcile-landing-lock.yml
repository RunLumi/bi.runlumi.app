# Temporary PR #8 lock reconciliation. Remove before final acceptance.
# Only the previously admitted Geist entry from the immutable main revision is copied.
name: reconcile-landing-lock
on:
  push:
    branches: [feat/astro-commerce-landing]
    paths: ['.github/workflows/reconcile-landing-lock.yml']
permissions:
  contents: write
jobs:
  reconcile:
    if: github.repository == 'RunLumi/lumi-bi' && github.ref == 'refs/heads/feat/astro-commerce-landing'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Preserve main's reviewed Vietnamese font, not a fresh dependency resolution
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const original = JSON.parse(execFileSync('git', ['show', 'a840ab020b6417d8511a79294132feab86cfa638:web/package-lock.json'], {encoding:'utf8'}));
          const lock = JSON.parse(readFileSync('web/package-lock.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('web/package.json', 'utf8'));
          const name = '@fontsource-variable/geist';
          const path = `node_modules/${name}`;
          const admitted = original.packages[path];
          assert.equal(admitted.version, '5.3.0');
          assert.equal(manifest.dependencies[name], admitted.version);
          assert.ok(admitted.integrity && admitted.resolved.startsWith('https://registry.npmjs.org/'));
          assert.equal(Object.keys(admitted.dependencies || {}).length, 0);
          lock.packages[path] = admitted;
          lock.packages[''].dependencies[name] = admitted.version;
          lock.packages[''].engines = manifest.engines;
          writeFileSync('web/package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Verify exact install and advisories
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --json > audit.json
      - name: Commit only the reconciled lock, with a remote-head race guard
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin feat/astro-commerce-landing
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test -z "$(git diff --name-only | grep -v '^web/package-lock.json$' || true)"
          if ! git diff --quiet -- web/package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add web/package-lock.json
            git commit -m 'build(web): preserve main reviewed Vietnamese font lock during PR 8 reconciliation'
            git push origin HEAD:feat/astro-commerce-landing
          fi
      - name: Package exact review inputs for offline build and visual inspection
        run: |
          git archive --format=tar.gz HEAD > merged-source.tar.gz
          tar -C web -czf merged-dependencies.tar.gz node_modules
          git rev-parse HEAD > merged-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr8-reconciled-inputs
          path: |
            merged-source.tar.gz
            merged-dependencies.tar.gz
            merged-revision.txt
            web/audit.json
          retention-days: 1
