name: landing
on:
  pull_request:
    paths: ['web/**', '.github/workflows/landing.yml', 'DESIGN.md', 'ICON.md', 'AGENTS.md']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/landing.yml', 'DESIGN.md', 'ICON.md', 'AGENTS.md']
permissions:
  contents: read
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - name: Install reviewed lock without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Advisory gate
        run: |
          mkdir -p artifacts
          npm audit --audit-level=high --json > artifacts/npm-audit.json
      - run: npm run check
      - run: npm run build
      - name: Install pinned Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Record tested inputs and built assets
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/tested-revision.txt
          git archive --format=tar.gz HEAD > artifacts/tested-source.tar.gz
          if test -f package-lock.json; then sha256sum package-lock.json > artifacts/lock.sha256; fi
          if test -d dist; then find dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/assets.sha256; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: landing-evidence
          path: |
            web/artifacts/
            web/package-lock.json
            web/test-results/
            web/playwright-report/
            web/dist/
          retention-days: 7
