name: prepare-license-blobs
on:
  push:
    branches: [chore/licensing-elv2]
    paths: [.github/workflows/prepare-license-blobs.yml]
permissions:
  contents: read
jobs:
  metadata:
    if: github.repository == 'RunLumi/lumi-bi' && github.ref == 'refs/heads/chore/licensing-elv2' && github.actor == 'streamentry'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      # No checkout, package install, repository script, commit, ref update or deployment.
      # Only create two content-addressed objects whose exact old/new SHAs were reviewed.
      - name: Prepare deterministic metadata-only objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, urllib.request
          repo = 'RunLumi/lumi-bi'
          baseline = '15b282a7a6d8ce958c5df7f8480c2018bf7c59b0'
          def api(path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path, data=data, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = [
              ('apps/web/package-lock.json', 'd630e38d5a2920c3b977a52816a8df3004956ebb', '913ee15eb71146dbe300ffc35c7bf359881e75f1'),
              ('web/package-lock.json', 'e39db6d5f1d408e72d5bc948e5a52d07b7f33d1c', '0e14e240e1d40375cf64ff5cf9d3d29c857b5b95')
          ]
          for path, old_sha, expected_sha in entries:
              source = api('contents/' + path + '?ref=' + baseline)
              assert source['sha'] == old_sha and source['encoding'] == 'base64'
              raw = base64.b64decode(source['content'])
              assert raw.count(b'"license": "UNLICENSED"') == 1
              updated = raw.replace(b'"license": "UNLICENSED"', b'"license": "Elastic-2.0"')
              before, after = json.loads(raw), json.loads(updated)
              before['packages']['']['license'] = 'Elastic-2.0'
              assert before == after
              actual = hashlib.sha1(b'blob ' + str(len(updated)).encode() + b'\0' + updated).hexdigest()
              assert actual == expected_sha
              result = api('git/blobs', {'content': base64.b64encode(updated).decode(), 'encoding': 'base64'})
              assert result['sha'] == expected_sha
              print(path, result['sha'])
          PY
