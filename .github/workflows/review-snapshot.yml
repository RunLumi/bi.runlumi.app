name: review-snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - name: Archive tracked source only
        run: |
          mkdir -p review-artifacts
          git archive --format=tar HEAD | gzip > review-artifacts/source.tar.gz
          git rev-parse HEAD > review-artifacts/revision.txt
      - name: Install tooling without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          if test -f apps/web/package-lock.json; then npm --prefix apps/web ci --ignore-scripts; else npm --prefix apps/web install --ignore-scripts; fi
          tar -czf review-artifacts/tooling.tar.gz node_modules apps/web/node_modules apps/web/package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr2-review-snapshot
          path: review-artifacts/
          retention-days: 1
