name: prepare-landing-test-toolchain
on:
  push:
    branches: [feat/astro-commerce-landing]
    paths: [.github/workflows/prepare-landing.yml]
permissions:
  contents: read
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Resolve compatible exact test graph, no lifecycle scripts
        working-directory: web
        run: |
          node --input-type=module -e "import fs from 'node:fs';let p=JSON.parse(fs.readFileSync('package.json'));p.engines.node='>=24.21.0 <25';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --save-dev --save-exact --ignore-scripts @types/node@24 playwright-core@1.62.1
          printf '24.21.0\n' > .nvmrc
          npm ls playwright-core @types/node
          npm audit --json > audit.json || true
          tar -czf ../landing-test-toolchain.tgz node_modules package.json package-lock.json audit.json
          cp "$(command -v node)" ../node-24
      - name: Commit only resolved marketing graph; remove one-time bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/package.json web/package-lock.json web/.nvmrc
          git rm -- .github/workflows/prepare-landing.yml
          git commit -m 'build(web): pin supported LTS and one compatible Playwright core'
          git push origin HEAD:feat/astro-commerce-landing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: landing-test-toolchain
          path: |
            landing-test-toolchain.tgz
            node-24
            web/audit.json
          retention-days: 1
