name: prepare-landing-social-card
on:
  push:
    branches: [feat/astro-commerce-landing]
    paths: [.github/workflows/prepare-landing.yml]
permissions:
  contents: read
jobs:
  prepare:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - run: node scripts/social-card.mjs
        working-directory: web
      - name: Commit one generated image; remove this one-time bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- web/public/social-card.png
          git rm -- .github/workflows/prepare-landing.yml
          git commit -m 'build(web): add rendered social preview and remove bootstrap workflow'
          git push origin HEAD:feat/astro-commerce-landing
      - name: Package source for local verification
        if: always()
        run: tar --exclude=node_modules --exclude=dist --exclude=.astro -czf landing-source.tgz web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: landing-source-bootstrap
          path: landing-source.tgz
          retention-days: 1
