# Temporary font admission. Produces candidate blobs for review, never updates refs.
name: prepare-landing-lock
on:
  push:
    branches: [feat/astro-landing-cloudflare-pages]
    paths: ['.github/workflows/prepare-landing.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'RunLumi/lumi-bi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Resolve a mature Geist release and inspect its declared language subsets
        working-directory: web
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, mkdir, writeFile } from 'node:fs/promises';
          const response = await fetch('https://registry.npmjs.org/@fontsource-variable%2Fgeist');
          if (!response.ok) throw new Error(`Registry request failed: ${response.status}`);
          const registry = await response.json();
          const cutoff = Date.now() - 7 * 86400000;
          const versions = Object.keys(registry.versions).filter(version => /^5\.\d+\.\d+$/.test(version) && Date.parse(registry.time[version]) <= cutoff).sort((a, b) => { const aa = a.split('.').map(Number), bb = b.split('.').map(Number); return bb[0]-aa[0] || bb[1]-aa[1] || bb[2]-aa[2]; });
          const version = versions[0];
          if (!version) throw new Error('No mature stable Geist package');
          console.log(`GEIST_CANDIDATE=${version}; PUBLISHED=${registry.time[version]}`);
          execFileSync('npm', ['install', '--save-exact', '--ignore-scripts', `@fontsource-variable/geist@${version}`], { stdio: 'inherit' });
          const metadata = JSON.parse(await readFile('node_modules/@fontsource-variable/geist/metadata.json', 'utf8'));
          console.log('GEIST_METADATA=' + JSON.stringify(metadata));
          if (!metadata.subsets.includes('vietnamese')) throw new Error('Geist candidate lacks declared Vietnamese subset');
          await mkdir('artifacts', { recursive: true });
          await writeFile('artifacts/geist-admission.json', JSON.stringify({ version, published: registry.time[version], metadata }, null, 2));
          NODE
      - name: Store manifest and lock candidates without modifying refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const blobs = {};
          for (const file of ['package.json', 'package-lock.json']) {
            const content = await readFile(`web/${file}`, 'utf8');
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content, encoding: 'utf-8' }),
            });
            if (!response.ok) throw new Error(`Blob creation failed: ${response.status}`);
            blobs[file] = (await response.json()).sha;
          }
          await writeFile('web/artifacts/review-blobs.json', JSON.stringify(blobs, null, 2));
          console.log('REVIEW_BLOBS=' + JSON.stringify(blobs));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: landing-font-admission
          path: |
            web/package.json
            web/package-lock.json
            web/artifacts/
          retention-days: 2
