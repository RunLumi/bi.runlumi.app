name: capture-reviewed-lock
on:
  push:
    branches: [feat/control-plane-tenant-packs-react]
    paths: [.github/workflows/capture-reviewed-lock.yml]
permissions:
  contents: write
  actions: read
jobs:
  capture:
    if: github.repository == 'RunLumi/lumi-bi'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Commit only the reviewed lockfile; no checkout or dependency execution
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, urllib.request, urllib.error, zipfile
          root = 'https://api.github.com/repos/RunLumi/lumi-bi'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, data=None, method=None):
              req = urllib.request.Request(root + path, headers=headers, data=None if data is None else json.dumps(data).encode(), method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args): return None
          req = urllib.request.Request(root + '/actions/artifacts/10599621762/zip', headers=headers)
          try:
              urllib.request.build_opener(NoRedirect()).open(req, timeout=30)
              raise RuntimeError('Expected artifact redirect')
          except urllib.error.HTTPError as e:
              if e.code != 302: raise
              location = e.headers['Location']
          assert location.startswith('https://')
          # Temporary object URL receives no GitHub authorization header.
          with urllib.request.urlopen(location, timeout=30) as response:
              archive = response.read(1000000)
          assert hashlib.sha256(archive).hexdigest() == '69eb8cc4bc8d7b93b33402f5581bfff44dab7a80d370f43865de963c82fd3f28'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              content = z.read('artifacts/frontend-package-lock.json')
          assert hashlib.sha256(content).hexdigest() == '2f44e5b3822468d8f0f67c6a542a1aeb045de05ace353f61d6c905b1c2250ceb'
          head = api('/git/ref/heads/feat/control-plane-tenant-packs-react')['object']['sha']
          assert head == os.environ['EXPECTED_HEAD'], 'Branch moved; do not overwrite work'
          blob = api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})['sha']
          tree = api('/git/trees', {'base_tree': api('/git/commits/' + head)['tree']['sha'], 'tree': [{'path': 'apps/web/package-lock.json', 'mode': '100644', 'type': 'blob', 'sha': blob}]})['sha']
          commit = api('/git/commits', {'message': 'build(web): commit reviewed immutable dependency lock', 'tree': tree, 'parents': [head]})['sha']
          # Ref update is fast-forward only. Any intervening change rejects the update.
          api('/git/refs/heads/feat/control-plane-tenant-packs-react', {'sha': commit, 'force': False}, 'PATCH')
          print('Committed reviewed lockfile:', commit)
          PY
