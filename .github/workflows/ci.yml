name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:commerce
      - run: npm run check:web-deps
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Install and build shared packages before the standalone web graph
        run: npm ci --ignore-scripts && npm run build:packages
      - name: Install exact reviewed graph without package lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts
      - run: npm run check:web-deps
      - name: Advisory gate (high/critical and audit failures block merge)
        run: |
          mkdir -p artifacts
          npm --prefix apps/web audit --audit-level=high --json > artifacts/npm-audit.json
      - run: npm run build:web
      - name: Install pinned Playwright browser
        run: ./apps/web/node_modules/.bin/playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - name: Record reproducible build hashes and tracked source
        if: always()
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/tested-revision.txt
          git archive --format=tar.gz HEAD > artifacts/tested-source.tar.gz
          sha256sum artifacts/tested-source.tar.gz > artifacts/source.sha256
          sha256sum apps/web/package-lock.json > artifacts/lock.sha256
          if test -d apps/web/dist; then find apps/web/dist -type f -print0 | sort -z | xargs -0 sha256sum > artifacts/assets.sha256; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-evidence
          path: |
            artifacts/
            apps/web/test-results/
          retention-days: 7
