name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:web-deps
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Package the reviewed core release from this commit
        run: npm run core:pack
      - name: Prove packing is reproducible (byte-identical rerun)
        run: |
          sha256sum artifacts/core/*.tgz > /tmp/pack-a.txt
          npm run core:pack
          sha256sum artifacts/core/*.tgz > /tmp/pack-b.txt
          diff /tmp/pack-a.txt /tmp/pack-b.txt
      - name: Align starter lock with the CI-packed artifacts
        run: npm run refresh:customer-lock
      - name: Behavioral checks under real local workerd with local D1
        run: node scripts/workerd-check.mjs
      - name: Two-customer acceptance from the packaged release
        run: node scripts/acceptance-two-customers.mjs
      - name: Upload packed artifacts (failure diagnostics)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-artifacts
          path: artifacts/core
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Install and build shared packages before the standalone web graph
        run: npm ci --ignore-scripts && npm run build:packages
      - name: Install exact reviewed graph without package lifecycle scripts
        run: npm --prefix apps/web ci --ignore-scripts
      - run: npm run check:web-deps
      - name: Advisory gate (high/critical and audit failures block merge)
        run: |
          mkdir -p artifacts
          npm --prefix apps/web audit --audit-level=high --json > artifacts/npm-audit.json
      - run: npm run build:web
      - name: Install pinned Playwright browser
        run: ./apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser journeys (demo UI checks and strict first-run journey)
        run: npm --prefix apps/web run test:e2e
